services:
  web:
    build: .
    container_name: webseite-seniorendienst-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
 
  db:
    image: mysql:8
    container_name: webseite-seniorendienst-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webseite-seniorendienst
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
 
volumes:
  db_data: